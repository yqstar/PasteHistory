name: Release PasteHistory

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build universal DMG and publish Release
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "Release tag does not exist: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" \
            Info.plist
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            Info.plist

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build universal app
        shell: bash
        run: |
          ./build.sh

          BINARY="build/PasteHistory.app/Contents/MacOS/PasteHistory"
          ARCHS="$(lipo -archs "$BINARY")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]
          codesign --verify --deep --strict build/PasteHistory.app

      - name: Package and verify DMG
        shell: bash
        run: |
          ./make-dmg.sh
          hdiutil verify build/PasteHistory.dmg

          ASSET="PasteHistory-${VERSION}-universal.dmg"
          mv build/PasteHistory.dmg "build/$ASSET"
          (
            cd build
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          )

          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "build/$ASSET#PasteHistory for macOS (Universal)" \
            "build/$ASSET.sha256#SHA-256 checksum" \
            --verify-tag \
            --generate-notes \
            --title "PasteHistory $TAG"
