name: Release PasteHistory

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build universal app and DMG and publish Release
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "Release tag does not exist: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          # Historical tags predate the bundled changelog; keep manual rebuilds working.
          if [[ -f Tools/release-notes.py ]]; then
            SOURCE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
            if [[ "$SOURCE_VERSION" != "$VERSION" ]]; then
              echo "Info.plist version $SOURCE_VERSION does not match release tag $TAG"
              exit 1
            fi
            python3 Tools/release-notes.py "$VERSION" > "$RUNNER_TEMP/pastehistory-release-notes.md"
          else
            : > "$RUNNER_TEMP/pastehistory-release-notes.md"
          fi

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" \
            Info.plist
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            Info.plist

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run logic tests
        run: bash test.sh

      - name: Build universal app
        shell: bash
        run: |
          ./build.sh

          BINARY="build/PasteHistory.app/Contents/MacOS/PasteHistory"
          ARCHS="$(lipo -archs "$BINARY")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]
          codesign --verify --deep --strict build/PasteHistory.app

      - name: Package and verify DMG
        shell: bash
        run: |
          ./make-dmg.sh
          hdiutil verify build/PasteHistory.dmg

          DMG_ASSET="PasteHistory-${VERSION}-universal.dmg"
          mv build/PasteHistory.dmg "build/$DMG_ASSET"
          (
            cd build
            shasum -a 256 "$DMG_ASSET" > "$DMG_ASSET.sha256"
            shasum -a 256 -c "$DMG_ASSET.sha256"
          )

          echo "DMG_ASSET=$DMG_ASSET" >> "$GITHUB_ENV"

      - name: Package and verify app ZIP
        shell: bash
        run: |
          APP_ASSET="PasteHistory-${VERSION}-universal.app.zip"
          # A macOS .app is a directory; ZIP keeps the complete bundle downloadable.
          ditto -c -k --sequesterRsrc --keepParent \
            build/PasteHistory.app "build/$APP_ASSET"

          VERIFY_DIR="$(mktemp -d "$RUNNER_TEMP/pastehistory-app-check.XXXXXX")"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          ditto -x -k "build/$APP_ASSET" "$VERIFY_DIR"

          EXTRACTED_APP="$VERIFY_DIR/PasteHistory.app"
          BINARY="$EXTRACTED_APP/Contents/MacOS/PasteHistory"
          [[ -d "$EXTRACTED_APP" ]]
          [[ -x "$BINARY" ]]
          lipo "$BINARY" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$EXTRACTED_APP"
          diff -qr build/PasteHistory.app "$EXTRACTED_APP"

          (
            cd build
            shasum -a 256 "$APP_ASSET" > "$APP_ASSET.sha256"
            shasum -a 256 -c "$APP_ASSET.sha256"
          )

          echo "APP_ASSET=$APP_ASSET" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "build/$DMG_ASSET#PasteHistory for macOS (Universal DMG)" \
            "build/$DMG_ASSET.sha256#DMG SHA-256 checksum" \
            "build/$APP_ASSET#PasteHistory.app for macOS (Universal ZIP)" \
            "build/$APP_ASSET.sha256#App ZIP SHA-256 checksum" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/pastehistory-release-notes.md" \
            --generate-notes \
            --title "PasteHistory $TAG"
